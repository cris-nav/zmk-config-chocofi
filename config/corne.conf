# Custom Bluetooth name (max 16 characters)
CONFIG_ZMK_KEYBOARD_NAME="Chocofi"

# CORE FUNCTIONALITY & BUILD REQUIREMENTS
# Enable mouse key emulation (required for &mmv movement and &mkp click behaviors)
CONFIG_ZMK_POINTING=y

# Prevent key chatter / double press issues (5ms press, 5ms release)
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# BLUETOOTH STABILITY & WIRELESS CONNECTIVITY
# Increase Bluetooth transmission power to +8 dBm for maximum range and stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable experimental Bluetooth features to improve split inter-half communication
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# POWER MANAGEMENT & BATTERY SAVING
# Enable low-power idle state after 30 seconds of inactivity
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable deep sleep support to conserve battery when idle
CONFIG_ZMK_SLEEP=y

# Set deep sleep timeout to 5 minutes (300,000 ms of inactivity)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Report battery level for both halves (Master and Peripheral)
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


